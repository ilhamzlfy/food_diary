<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Diary Ilyas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Mencegah warna sorotan abu-abu di iPhone */
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8f8f8;
            padding: 16px;
            color: #1a1a1a;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .header p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .entry-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 12px;
            cursor: pointer; /* WAJIB untuk iOS agar bisa di-tap */
        }

        .entry-time {
            font-weight: 600;
            font-size: 15px;
            color: #2563eb;
        }

        .entry-date {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        .btn-delete {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #ef4444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            padding: 6px 12px;
            font-weight: 500;
        }

        .btn-delete:hover {
            background: #fee2e2;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-bottom: 6px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px; /* Menggunakan 14px-16px agar iOS tidak otomatis auto-zoom saat mengetik */
            font-family: inherit;
            color: #1a1a1a;
            background-color: #fff;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 60px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
        }

        @media(min-width: 480px) {
            .row {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            color: #2563eb;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .toggle-form {
            display: none;
        }

        .toggle-form.open {
            display: block;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
            margin-top: 12px;
        }

        .entry-summary {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            line-height: 1.4;
            background: #fafafa;
            padding: 10px;
            border-radius: 6px;
            margin-top: 6px;
            cursor: pointer; /* WAJIB untuk iOS */
        }

        .summary-item {
            color: #444;
        }

        .summary-label {
            font-weight: 600;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Food Diary Ilyas</h1>
            <p>Catat waktu makan, makanan, dan kapan nausea muncul. Data ini akan dibawa ke dokter.</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-entries">0</div>
                <div class="stat-label">Total entries</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="nausea-count">0</div>
                <div class="stat-label">Kali nausea</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="addEntry()">+ Tambah Entry</button>
            <button class="btn" onclick="exportCSV()">📥 Export CSV</button>
            <button class="btn btn-danger" onclick="clearData()">🗑️ Clear All</button>
        </div>

        <div id="entries-container"></div>
    </div>

    <script>
        const STORAGE_KEY = 'ilyas_food_diary_v4';

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveDataSilent(entries) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
            updateStatsOnly(entries);
        }

        function updateStatsOnly(entries) {
            document.getElementById('total-entries').textContent = entries.length;
            const nauseaCount = entries.filter(e => e.nauseaMenit && String(e.nauseaMenit).trim() !== '').length;
            document.getElementById('nausea-count').textContent = nauseaCount;
        }

        function addEntry() {
            const entries = loadData();
            const now = new Date();
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const formatTanggal = `${year}-${month}-${day}`;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const formatWaktu = `${hours}:${minutes}`;
            
            entries.unshift({
                id: Date.now(),
                tanggal: formatTanggal,
                waktu: formatWaktu,
                makanan: '',
                porsi: '',
                nauseaMenit: '',
                muntah: 'tidak',
                kondisi: '',
                catatan: ''
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
            renderAll();
            
            if(entries.length > 0) {
                toggleForm(entries[0].id);
            }
        }

        function deleteEntry(id) {
            if (confirm('Hapus entry ini?')) {
                const entries = loadData();
                const filtered = entries.filter(e => e.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
                renderAll();
            }
        }

        function updateEntry(id, field, value) {
            const entries = loadData();
            const entry = entries.find(e => e.id === id);
            if (entry) {
                entry[field] = value;
                saveDataSilent(entries);
                
                const summaryEl = document.getElementById(`summary-text-${id}-${field}`);
                if (summaryEl) {
                    if (field === 'muntah') {
                        summaryEl.textContent = value === 'ya' ? '✓ Ya' : '✗ Tidak';
                    } else if (field === 'nauseaMenit') {
                        summaryEl.textContent = value ? `Menit ke ${value}` : '-';
                    } else {
                        summaryEl.textContent = value || '-';
                    }
                }
            }
        }

        function toggleForm(id) {
            const form = document.getElementById(`form-${id}`);
            if (form) {
                form.classList.toggle('open');
            }
        }

        function exportCSV() {
            const entries = loadData();
            if (entries.length === 0) {
                alert('Tidak ada data untuk di-export.');
                return;
            }

            const headers = ['Tanggal', 'Waktu', 'Makanan', 'Porsi', 'Nausea (Menit)', 'Muntah?', 'Kondisi', 'Catatan'];
            const rows = entries.map(e => [
                e.tanggal,
                e.waktu,
                e.makanan,
                e.porsi,
                e.nauseaMenit,
                e.muntah === 'ya' ? 'Ya' : 'Tidak',
                e.kondisi,
                e.catatan
            ]);

            const csv = [headers, ...rows].map(row =>
                row.map(cell => `"${String(cell || '').replace(/"/g, '""')}"`).join(',')
            ).join('\n');

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `Ilyas_FoodDiary_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearData() {
            if (confirm('Yakin mau hapus semua data? Tidak bisa di-undo.')) {
                localStorage.removeItem(STORAGE_KEY);
                renderAll();
            }
        }

        function renderAll() {
            const entries = loadData();
            const container = document.getElementById('entries-container');

            updateStatsOnly(entries);

            if (entries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>Belum ada data</p>
                        <p style="font-size: 12px; color: #ccc;">Klik "Tambah Entry" untuk mulai tracking</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = entries.map(entry => {
                let displayTanggal = entry.tanggal;
                try {
                    if(entry.tanggal) {
                        const parts = entry.tanggal.split('-');
                        if(parts.length === 3) {
                            displayTanggal = `${parts[2]}/${parts[1]}/${parts[0]}`;
                        }
                    }
                } catch(e) {}

                return `
                <div class="entry-card">
                    <div class="entry-header" onclick="toggleForm(${entry.id})" role="button">
                        <div>
                            <div class="entry-time">${entry.waktu || '--:--'}</div>
                            <div class="entry-date">${displayTanggal || 'Pilih Tanggal'}</div>
                        </div>
                        <button class="btn-delete" onclick="event.stopPropagation(); deleteEntry(${entry.id})">Hapus</button>
                    </div>

                    <div class="entry-summary" onclick="toggleForm(${entry.id})" role="button">
                        <div class="summary-item"><span class="summary-label">Makanan:</span> <span id="summary-text-${entry.id}-makanan">${entry.makanan || '-'}</span></div>
                        <div class="summary-item"><span class="summary-label">Porsi:</span> <span id="summary-text-${entry.id}-porsi">${entry.porsi || '-'}</span></div>
                        <div class="summary-item"><span class="summary-label">Nausea:</span> <span id="summary-text-${entry.id}-nauseaMenit">${entry.nauseaMenit ? 'Menit ke ' + entry.nauseaMenit : '-'}</span></div>
                        <div class="summary-item"><span class="summary-label">Muntah:</span> <span id="summary-text-${entry.id}-muntah">${entry.muntah === 'ya' ? '✓ Ya' : '✗ Tidak'}</span></div>
                    </div>

                    <div class="toggle-form" id="form-${entry.id}">
                        <div class="form-group">
                            <label class="form-label">Tanggal</label>
                            <input type="date" class="form-input" value="${entry.tanggal}" onchange="updateEntry(${entry.id}, 'tanggal', this.value)">
                        </div>

                        <div class="row">
                            <div class="form-group">
                                <label class="form-label">Waktu</label>
                                <input type="time" class="form-input" value="${entry.waktu}" onchange="updateEntry(${entry.id}, 'waktu', this.value)">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Nausea muncul (menit ke-)</label>
                                <input type="number" class="form-input" placeholder="Contoh: 15" value="${entry.nauseaMenit}" oninput="updateEntry(${entry.id}, 'nauseaMenit', this.value)">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Makanan (spesifik)</label>
                            <input type="text" class="form-input" placeholder="Nasi + ayam + sayur bayam" value="${entry.makanan}" oninput="updateEntry(${entry.id}, 'makanan', this.value)">
                        </div>

                        <div class="row">
                            <div class="form-group">
                                <label class="form-label">Porsi</label>
                                <input type="text" class="form-input" placeholder="Piring kecil, 5 sendok..." value="${entry.porsi}" oninput="updateEntry(${entry.id}, 'porsi', this.value)">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Muntah?</label>
                                <select class="form-select" onchange="updateEntry(${entry.id}, 'muntah', this.value)">
                                    <option value="tidak" ${entry.muntah === 'tidak' ? 'selected' : ''}>✗ Tidak</option>
                                    <option value="ya" ${entry.muntah === 'ya' ? 'selected' : ''}>✓ Ya</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Kondisi saat makan</label>
                            <input type="text" class="form-input" placeholder="Duduk di meja, mood bagus..." value="${entry.kondisi}" oninput="updateEntry(${entry.id}, 'kondisi', this.value)">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Catatan tambahan</label>
                            <textarea class="form-textarea" placeholder="Apapun yang tidak biasa..." oninput="updateEntry(${entry.id}, 'catatan', this.value)">${entry.catatan}</textarea>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        renderAll();
    </script>
</body>
</html>
